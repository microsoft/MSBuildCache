variables:
- template: templates\variables.yml

schedules:
- cron: '0 0 * * *'
  displayName: Daily midnight build
  branches:
    include:
    - main
  always: true

trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    exclude:
    - '*.md'

pool:
  vmImage: windows-latest

resources:
  repositories:
  - repository: msbuild
    type: github
    endpoint: 'MSBuild Github'
    name: dotnet/msbuild
    ref: main

jobs:
- job: Build
  displayName: Build and Test
  steps:
  - checkout: self
    # Fetch all history for versioning
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: 'Install .NET 10.x'
    inputs:
      version: '10.x'

  - task: UseDotNet@2
    displayName: 'Install .NET 11.x'
    inputs:
      version: '11.x'

  - task: NuGetAuthenticate@1
    displayName: NuGet Authenticate

  - script: |
      dotnet build $(Build.SourcesDirectory)/MSBuildCache.sln --configuration $(BuildConfiguration) -BinaryLogger:$(LogDirectory)/msbuild.binlog
    displayName: Build

  - pwsh: |
      $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
        -latest -products '*' -requires Microsoft.Component.MSBuild `
        -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
      if (-not $msbuild) { throw 'Framework MSBuild was not found.' }
      Write-Host "##vso[task.setvariable variable=FrameworkMSBuildPath]$msbuild"
    displayName: Locate Framework MSBuild

  - task: DotNetCoreCLI@2
    displayName: Run Unit Tests
    inputs:
      command: test
      projects: $(Build.SourcesDirectory)/MSBuildCache.sln
      arguments: --no-build --configuration $(BuildConfiguration)
    env:
      MSBUILD_EXE_PATH: $(FrameworkMSBuildPath)

  - pwsh: |
      foreach ($major in @(10, 11)) {
        $sdk = Get-ChildItem "$env:DOTNET_ROOT\sdk" -Directory |
          Where-Object { $_.Name -match "^$major\." } |
          Sort-Object { [System.Management.Automation.SemanticVersion]$_.Name } -Descending |
          Select-Object -First 1
        if (-not $sdk) { throw "The .NET $major SDK was not found." }
        & "$(Build.SourcesDirectory)\tests\smoke-core.ps1" `
          -LocalPackageDir "$(ArtifactsDirectory)\$(BuildConfiguration)\packages" `
          -MSBuildPath "$env:DOTNET_ROOT\sdk\$($sdk.Name)\MSBuild.dll" `
          -TestRoot "$(Agent.TempDirectory)\msbuildcache-smoke-core\$($sdk.Name)"
      }
    displayName: 'Smoke test with .NET 10 and 11 MSBuild'
    workingDirectory: $(Build.SourcesDirectory)

  - publish: $(ArtifactsDirectory)
    displayName: Publish Artifacts
    artifact: artifacts
    condition: always()

  - publish: $(LogDirectory)
    displayName: Publish Logs
    artifact: '$(System.JobDisplayName) logs'
    condition: always()

- job: E2ETestVS
  displayName: E2E Tests using VS
  dependsOn: Build
  variables:
    VsInstallDir: $(Build.ArtifactStagingDirectory)\vs
    MSBuildPath: $(VsInstallDir)\MSBuild\Current\Bin\amd64\MSBuild.exe
  steps:
  - download: current
    displayName: 'Download Build Artifacts'
    artifact: artifacts

  - checkout: self

  # Avoiding Caching VS for now as the installer command we're using doesn't work for upgrades
  # - task: Cache@2
  #   displayName: Cache Visual Studio
  #   inputs:
  #     key: '"vs" | "$(Agent.OS)"'
  #     path: $(VsInstallDir)

  - script: |
      del %TEMP%\vs_buildtools.exe
      
      curl.exe -L https://aka.ms/vs/18/stable/vs_buildtools.exe -o %TEMP%\vs_buildtools.exe
      
      %TEMP%\vs_buildtools.exe ^
        --config "$(Build.SourcesDirectory)\.vsconfig" ^
        --installPath "$(VsInstallDir)" ^
        --passive ^
        --norestart ^
        --wait
      echo VS installer exit code: %ERRORLEVEL%

      del %TEMP%\vs_buildtools.exe

      echo Copying installer logs
      mkdir "$(LogDirectory)\VSSetup"
      move "%TEMP%\dd_*" "$(LogDirectory)\VSSetup\"

      echo Current MSBuild version:
      "$(MSBuildPath)" --version
    displayName: 'Install VS'

  - template: templates\e2e-test.yml
    parameters:
      RepoRoot: $(Build.SourcesDirectory)
      MSBuildPath: $(MSBuildPath)

  - publish: $(LogDirectory)
    displayName: Publish Logs
    artifact: '$(System.JobDisplayName) logs'
    condition: always()

- job: E2ETestMSBuildRepo
  displayName: E2E Tests using tip of MSBuild repo
  dependsOn: Build
  variables:
    VsInstallDir: $(Build.ArtifactStagingDirectory)\vs
    MSBuildPath: $(Build.SourcesDirectory)\msbuild\artifacts\bin\bootstrap\net472\MSBuild\Current\Bin\amd64\MSBuild.exe
  steps:
  - download: current
    displayName: 'Download Build Artifacts'
    artifact: artifacts

  - checkout: self

  - checkout: msbuild

  # Building tip-of-main MSBuild requires a full Visual Studio; build.cmd locates it via vswhere,
  # so installing VS here (regardless of install path) satisfies that lookup and is also available
  # to the E2E test that runs the bootstrapped MSBuild.
  - script: |
      del %TEMP%\vs_buildtools.exe

      curl.exe -L https://aka.ms/vs/18/stable/vs_buildtools.exe -o %TEMP%\vs_buildtools.exe

      %TEMP%\vs_buildtools.exe ^
        --config "$(Build.SourcesDirectory)\MSBuildCache\.vsconfig" ^
        --installPath "$(VsInstallDir)" ^
        --passive ^
        --norestart ^
        --wait
      echo VS installer exit code: %ERRORLEVEL%

      del %TEMP%\vs_buildtools.exe

      echo Copying installer logs
      mkdir "$(LogDirectory)\VSSetup"
      move "%TEMP%\dd_*" "$(LogDirectory)\VSSetup\"

      echo Installed VS MSBuild version:
      "$(VsInstallDir)\MSBuild\Current\Bin\amd64\MSBuild.exe" --version
    displayName: 'Install VS'

  - task: Cache@2
    displayName: Cache MSBuild
    inputs:
      key: '"msbuild" | "$(Agent.OS)" | "$(BuildConfiguration)" | ./msbuild/.git/HEAD'
      path: msbuild/artifacts
      cacheHitVar: MSBUILD_RESTORED

  - script: |
      .\msbuild\build.cmd /p:CreateBootstrap=true /p:Configuration=$(BuildConfiguration)
    displayName: Build MSBuild
    condition: ne(variables.MSBUILD_RESTORED, 'true')

  - template: templates\e2e-test.yml
    parameters:
      RepoRoot: $(Build.SourcesDirectory)/MSBuildCache
      MSBuildPath: $(MSBuildPath)
      # This job builds MSBuild from tip of main, which carries the enumeration pattern, so the
      # scenarios must actually run here rather than skip.
      RequireEnumerationCapability: true

  - publish: $(LogDirectory)
    displayName: Publish Logs
    artifact: '$(System.JobDisplayName) logs'
    condition: always()
